[project]
name = "shopmcp"
version = "0.1.0"
description = "MCP server for an online store, built from a config and an adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pyjwt[crypto]>=2.10",
    "snowballstemmer>=3",
]

[project.scripts]
shopmcp = "shopmcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["online: живой запрос к внешнему серверу, в CI не гоняется"]

[tool.ruff]
line-length = 100
target-version = "py312"
