id = "demo"                       # ^[a-z][a-z0-9-]{1,31}$
prefix = "demo"                   # ^[a-z][a-z0-9]{1,15}$, tool name prefix
brand = "Демо-маркет"
site = "https://demo.example"
locale = "ru"                     # ru | en: language of every model-facing text
instructions = """Магазин продуктов. Цены в рублях, доставка по Москве и области."""
phone = "+7 000 000-00-00"
delivery = "Курьером по Москве и области, самовывоз из пунктов выдачи."
payment = "Картой на сайте при оформлении заказа."
regions = ["Москва", "Московская область"]

[adapter]
kind = "yml"
feed = "stores/demo/feed.xml"     # path or https URL; ${ENV} is substituted
refresh_minutes = 60

[cart]
strategy = "url_template"         # share_link | url_template | link_list
url_template = "https://demo.example/cart/add?{items}"
item_template = "id[]={id}&qty[]={qty}"
item_separator = "&"

[limits]
max_page_size = 20
max_cart_lines = 30
max_response_bytes = 24000
rate_per_minute = 60

[server]
path = "/mcp"
host = "0.0.0.0"
port = 8000
public_url = "http://localhost:8000/mcp"      # resource in RFC 9728 and the token aud
allowed_hosts = ["localhost:*", "127.0.0.1:*"]
allowed_origins = []
trusted_proxies = []                          # whose X-Forwarded-For to trust for rate limit

[auth]
enabled = false
issuer = ""
jwks_uri = ""
[auth.tool_scopes]
orders_history = ["orders.read"]              # key = tool suffix

[tools]
disabled = []                                 # suffixes the store does not want to expose

[texts]
# Override any model-facing text by key, in the store language, e.g.:
# "tool.products_search.description" = "Поиск по каталогу Демо-маркета."

[conformance]
sample_query = "молоко"                       # must find >= 1 product
sample_barcode = "4600000000017"              # optional
